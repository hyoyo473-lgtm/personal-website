name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Environment Variables
        env:
          SECRET_GAS_URL: ${{ secrets.GOOGLE_APP_SCRIPT_URL }}
        run: |
          echo "🔧 設定系統環境變數..."
          node -e '
            const fs = require("fs");
            let url = (process.env.SECRET_GAS_URL || "").trim();
            if (!url && fs.existsSync(".env.example")) {
              const example = fs.readFileSync(".env.example", "utf8");
              const m = example.match(/^GOOGLE_APP_SCRIPT_URL=(.+)$/m);
              if (m) url = m[1].trim();
            }
            console.log(url ? "✅ 取得 GOOGLE_APP_SCRIPT_URL" : "⚠️ 未設定 GOOGLE_APP_SCRIPT_URL");
            fs.writeFileSync(".env", "GOOGLE_APP_SCRIPT_URL=" + url + "\n");
            fs.writeFileSync("env.js", "/** 由 GitHub Actions 自動部署時產製之環境變數設定 */\nwindow.__ENV__ = Object.assign(window.__ENV__ || {}, {\n  GOOGLE_APP_SCRIPT_URL: " + JSON.stringify(url) + "\n});\n");
          '
          echo "🚀 環境變數設定完成！"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
